<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash | A war card game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="index.js"></script>
</head>

<body class="bg-[url(/img/table.jpg)] min-h-screen bg-center bg-cover bg-no-repeat flex flex-col">
    <div class="flex-1 flex flex-col max-w-2xl w-full mx-auto px-4 py-4">
        <button id="new-deck" class="btn btn-warning text-base-content self-start">Shuffle Deck</button>
        <div id="cards-container" class="flex-1 flex flex-col items-center justify-center gap-12">
            <div class="w-[226px] h-[314px] border-2 border-white rounded-lg"></div>
            <div class="w-[226px] h-[314px] border-2 border-white rounded-lg"></div>
        </div>
    </div>
    <div class="flex justify-center pb-6 px-4 w-full mx-auto">
        <button id="draw-cards" class="btn btn-lg btn-warning text-base-content w-full md:w-64 text-xl"
            disabled>Draw</button>
    </div>
</body>

</html>
