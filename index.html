<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash | A war card game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="index.js"></script>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
</head>

<body class="bg-[url(/img/table.jpg)] min-h-screen bg-center bg-cover bg-no-repeat flex flex-col">
    <div class="flex-1 flex flex-col max-w-2xl w-full mx-auto px-4 py-3">
        <div class="flex justify-between items-center pb-3">
            <button id="new-deck" class="btn btn-warning text-base-content self-start">New Deck</button>
            <div id="cards-remaining" class="hidden self-center text-white text-base md:text-xl"></div>
        </div>

        <div id="result-msg" class="text-white flex justify-center text-xl md:text-3xl font-bold pb-3 text-center">Game
            of War 🃏</div>

        <div id="computer-score" class="text-white flex justify-center text-base md:text-2xl pb-2 hidden"></div>

        <div id="cards-container" class="flex-1 flex flex-col items-center justify-center gap-4 md:gap-8">
            <div class="w-[160px] h-[222px] md:w-[200px] md:h-[278px] border-2 border-white rounded-lg"></div>
            <div class="w-[160px] h-[222px] md:w-[200px] md:h-[278px] border-2 border-white rounded-lg"></div>
        </div>

        <div id="player-score" class="text-white flex justify-center text-base md:text-2xl pt-2 hidden"></div>
    </div>
    <div class="flex justify-center pb-4 px-4 w-full mx-auto pt-3">
        <button id="draw-cards" class="btn btn-lg btn-warning text-base-content w-full md:w-64 text-xl"
            aria-label="Draw two cards" disabled>Draw</button>
    </div>
</body>

</html>
